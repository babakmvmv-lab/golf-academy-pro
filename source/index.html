<!-- ═══════════ ورود ═══════════ -->
<div id="login">
  <img src="assets/login_bg.webp" class="bg-img" alt="">
  <div class="login-card glass gold-border">
    <div class="login-logo"><img src="assets/puttclub_logo.png" alt="لوگوی آکادمی گلف پات کلاب — Putt Club"></div>
    <h1 class="gold-text">آکادمی گلف</h1>
    <div class="err-msg" id="login-err"></div>
    <form id="login-form">
      <div class="field">
        <label>نام کاربری</label>
        <input type="text" id="login-user" placeholder="admin" autocomplete="username" required>
      </div>
      <div class="field">
        <label>رمز عبور</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" required>
        <span class="toggle-pass" id="toggle-pass">👁️</span>
      </div>
      <button type="submit" class="btn">ورود به داشبورد 🏌️</button>
    </form>
  </div>
</div>
