<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسویه | پات کلاب</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="site/css/site.css">
</head>
<body>
<div id="public-site">
  <section class="section">
    <div class="wrap">
      <h2>تسویه سفارش</h2>
      <p class="muted" id="checkout-sum"></p>
      <form class="checkout" id="checkout-form">
        <input name="name" required placeholder="نام و نام خانوادگی">
        <input name="phone" required placeholder="شماره تماس">
        <input name="city" placeholder="شهر" value="اهواز">
        <textarea name="address" required rows="3" placeholder="نشانی"></textarea>
        <button class="btn-solid" type="submit">ثبت سفارش نمایشی</button>
      </form>
    </div>
  </section>
</div>
<script src="site/js/site.js"></script>
</body>
</html>
