<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><script src="/site-cloud.current.js"></script>
<title>shop-ops layout test</title></head><body>
<div id="host"></div>
<script>
/* Stub cloud layer; the real shop-ops asset is loaded after this. */
window.PC_SITE_CLOUD_CONFIG={url:'http://stub.local',key:'stub-key'};window.__WEB_ADMIN=true;
window.__calls=[];
window.PC_SITE_CLOUD={
  accessToken:async()=>'stub-token',
  pull:async()=>true,
  shopCategories:()=>['توپ‌ها','چوب‌ها'],
  request:async(url,init={})=>{
    window.__calls.push({kind:'request',url,method:init.method||'GET',body:init.body});
    if(url==='/api/admin/reviews'){
      return {ok:true,json:async()=>({reviews:[
        {id:11,productId:1,author:' Ali ',rating:5,comment:'عالی بود',status:'pending',createdAt:'2026-09-27T10:00:00.000Z'},
        {id:12,productId:2,author:'Sara',rating:4,comment:'خوب',status:'approved',createdAt:'2026-09-26T10:00:00.000Z'}
      ]})};
    }
    return {ok:true,json:async()=>({ok:true})};
  },
  authDialog(){},settings:()=>({brand:{},marquee:{enabled:false}}),subscribe(){},table:()=>[],brandShort:()=>'پات‌کلاب',authSession:()=>({user:{app_metadata:{web_admin:window.__WEB_ADMIN===true}}}),
};
</script>
<script src="/source/js/site-img.js"></script>
  <script src="/shop-ops.current.js"></script>
<script>
/* Intercept web-erp calls (shop-ops api() uses raw fetch to the stub URL). */
const realFetch=window.fetch;
window.fetch=async(url,init={})=>{
  const u=String(url);
  if(u.includes('stub.local/functions/v1/web-erp')){
    const body=JSON.parse(init.body||'{}');
    window.__calls.push({kind:'erp',action:body.action,payload:body.payload});
    let data=null;
    if(body.action==='bootstrap'){
      data={user:{manager:true,name:'مدیر تست',today:'2026-09-27',permissions:{}},
        products:[
          {id:1,name:'توپ A',category:'توپ‌ها',sale_price:100,stock:5,sku:'T1',unit:'عدد',attributes:{},public_data:{sortOrder:2,images:[]}},
          {id:2,name:'توپ B',category:'توپ‌ها',sale_price:200,stock:5,sku:'T2',unit:'عدد',attributes:{},public_data:{sortOrder:1,images:[]}},
          {id:3,name:'چوب C',category:'چوب‌ها',sale_price:300,stock:5,sku:'C3',unit:'عدد',attributes:{},public_data:{sortOrder:1,images:[]}},
          {id:4,name:'کیف D',category:'کیف‌ها',sale_price:400,stock:5,sku:'K4',unit:'عدد',attributes:{},public_data:{images:[]}}
        ]};
    }
    if(body.action==='layout_save')data={ok:true};
    const backupProfile=system=>({version:3,enabled:true,mode:'daily',time:system==='academy'?'04:30':'04:00',intervalHours:6,weekday:6,monthDay:1,
      structures:{siteShop:system==='siteShop',academy:system==='academy'},academySchedule:{on:false},format:'json',compress:true,
      redact:{authUsers:'ids-only',dropTables:[]},retention:{daily:30,weekly:13,monthly:12,maxTotalMB:4000,pinOnRelease:true,pinnedDates:[]},
      destinations:[{type:'supabase',label:'فضای ابری خصوصی سوپابیس',on:true,config:{bucket:'puttclub-backups',public:false}}],
      emails:{notify:false,onSuccess:true,list:[],digest:'none',subjectPrefix:'[پات‌کلاب]'},
      verify:{afterWrite:true,restoreDrill:'weekly',graceMinutes:90},limits:{maxTotalMB:2000,timeoutSec:1800,retries:2}});
    window.__backupProfiles=window.__backupProfiles||{siteShop:backupProfile('siteShop'),academy:backupProfile('academy')};
    if(body.action==='backup_get'){const system=body.payload?.system||'siteShop';const settings=window.__backupProfiles[system]||backupProfile(system);data={system,settings,
      state:{result:'ok',lastRun:'2026-09-30T05:00:00Z',lastRunFa:'2026-09-30 08:30',trigger:'روزانه ساعت 04:00',totalKB:2851,files:5,verified:true,nextDue:'فردا 04:00',runId:system+'-run-1',errors:[],warnings:[]},
      runs:[{run_id:system+'-run-1',system_key:system,date_fa:'2026-09-30',started_fa:'2026-09-30 08:30',trigger:'دستی',result:'ok',files:5,total_bytes:2048,
        archive_path:'backups/'+(system==='academy'?'academy':'site-shop')+'/2026-09-30/'+system+'-run-1/bundle.zip',archive_bucket:'puttclub-backups',
        destination_status:{supabase:{uploaded:5,verified:true}},state:{emailDelivery:{status:'sent',accepted:1,requested:1}}}]};}
    if(body.action==='backup_save'){const system=body.payload?.system||'siteShop';window.__backupProfiles[system]=body.payload.settings;data={saved:true,system};}
    if(body.action==='backup_now')data={started:true,system:body.payload?.system};
    if(body.action==='backup_download')data={url:'https://storage.example.invalid/private/bundle.zip?token=test',expiresIn:300};
    return {ok:true,json:async()=>({ok:true,data})};
  }
  return realFetch(url,init);
};
window.addEventListener('error',e=>console.log('PAGEERROR',e.message));
</script>
</body></html>
<script>window.SHOP_OPS&&window.SHOP_OPS.mount(document.getElementById('host'));</script>
